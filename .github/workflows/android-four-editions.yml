name: Android four-edition source validation
on:
  push:
    branches:
      - 'edition/android-*'
  pull_request:
    branches: [wolfox-independent-v3-build]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required SDK using runner command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-34' 'build-tools;34.0.0'
      - name: Check source contract and payload bytes
        run: |
          python3 tests/verify_four_editions.py
          python3 tests/verify_design_palette.py
          python3 tests/verify_safe_device_tools.py
          mkdir -p /tmp/beacon-check
          javac -d /tmp/beacon-check app/src/main/java/com/wolfox/gps/compat/BeaconPayload.java verification/beacon/BeaconPayloadCheck.java
          java -cp /tmp/beacon-check BeaconPayloadCheck
      - name: Compile and run unit tests
        id: tests
        continue-on-error: true
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug
      - name: Assemble unsigned release
        run: bash ./gradlew --no-daemon :app:assembleRelease
      - name: Assemble installable debug APK
        run: bash ./gradlew --no-daemon :app:assembleDebug

      - name: Verify generated APK files
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - name: Sign production release when signing secrets are configured
        shell: bash
        env:
          WOLFOX_KEYSTORE_BASE64: ${{ secrets.WOLFOX_KEYSTORE_BASE64 }}
          WOLFOX_KEYSTORE_PASSWORD: ${{ secrets.WOLFOX_KEYSTORE_PASSWORD }}
          WOLFOX_KEY_ALIAS: ${{ secrets.WOLFOX_KEY_ALIAS }}
          WOLFOX_KEY_PASSWORD: ${{ secrets.WOLFOX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$WOLFOX_KEYSTORE_BASE64" || -z "$WOLFOX_KEYSTORE_PASSWORD" || -z "$WOLFOX_KEY_ALIAS" || -z "$WOLFOX_KEY_PASSWORD" ]]; then
            echo 'Production signing secrets not configured; leaving unsigned release for signing later.'
            exit 0
          fi
          umask 077
          trap 'rm -f "$RUNNER_TEMP/wolfox-release.jks"' EXIT
          printf '%s' "$WOLFOX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wolfox-release.jks"
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          aligned="app/build/outputs/apk/release/app-release-aligned.apk"
          signed="app/build/outputs/apk/release/WolFox-release-signed.apk"
          test -s "$unsigned"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -f -p 4 "$unsigned" "$aligned"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/wolfox-release.jks" \
            --ks-key-alias "$WOLFOX_KEY_ALIAS" \
            --ks-pass env:WOLFOX_KEYSTORE_PASSWORD \
            --key-pass env:WOLFOX_KEY_PASSWORD \
            --out "$signed" "$aligned"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$signed"
          rm -f "$aligned"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: WolFox-Android-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*unsigned.apk
            app/build/outputs/apk/release/*signed.apk
            app/build/outputs/apk/debug/*.apk
            app/build/test-results/
            app/build/reports/
          if-no-files-found: warn

      - name: Report test failures after preserving APK artifacts
        if: steps.tests.outcome == 'failure'
        run: |
          echo '::error::Unit tests or lint failed; release APK was built separately for diagnosis.'
          exit 1
