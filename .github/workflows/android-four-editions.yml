name: Android four-edition source validation
on:
  push:
    branches:
      - 'edition/android-*'
  pull_request:
    branches: [wolfox-independent-v3-build]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required SDK using runner command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-34' 'build-tools;34.0.0'
      - name: Verify complete Android build toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          bash ./gradlew --version
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f app/libs/xposed-api-82.jar
          test -x "$ANDROID_HOME/platform-tools/adb"
          for tool in aapt2 d8 zipalign apksigner; do
            test -f "$ANDROID_HOME/build-tools/34.0.0/$tool" || { echo "::error::Missing $tool"; exit 1; }
          done
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" --version
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -h >/dev/null 2>&1 || true
      - name: Check source contract and payload bytes
        run: |
          python3 tests/verify_four_editions.py
          python3 tests/verify_design_palette.py
          python3 tests/verify_safe_device_tools.py
          mkdir -p /tmp/beacon-check
          javac -d /tmp/beacon-check app/src/main/java/com/wolfox/gps/compat/BeaconPayload.java verification/beacon/BeaconPayloadCheck.java
          java -cp /tmp/beacon-check BeaconPayloadCheck
      - name: Compile and run unit tests
        id: tests
        continue-on-error: true
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug
      - name: Assemble unsigned release
        run: bash ./gradlew --no-daemon :app:assembleRelease
      - name: Verify release APK output
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No release APK produced"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            test -s "$apk"
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | head -n 5
            sha256sum "$apk"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: WolFox-Android-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/test-results/
            app/build/reports/
          if-no-files-found: warn

      - name: Report test failures after preserving APK artifacts
        if: steps.tests.outcome == 'failure'
        run: |
          echo '::error::Unit tests or lint failed; release APK was built separately for diagnosis.'
          exit 1
