name: Build Three WolFox Model APKs
on:
  push:
    branches: [wolfox-three-model-apks]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build three signed debug APKs
        run: gradle -p model-apks --no-daemon --stacktrace assembleDebug
      - name: Verify all APKs
        run: |
          for f in gpsOnly gpsBluetooth gpsCamera; do
            test -s "model-apks/build/outputs/apk/${f}/debug/model-apks-${f}-debug.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: WolFox-Three-Model-APKs
          path: model-apks/build/outputs/apk/*/debug/*.apk
