name: WolFox APK build
on:
  workflow_dispatch:
  push:
    branches: [wolfox-source-build]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK packages
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APKs
        run: gradle --no-daemon :app:assembleDebug :lspatch:assembleDebug --stacktrace
      - name: Verify APKs
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s lspatch/build/outputs/aar/lspatch-debug.aar
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          unzip -t lspatch/build/outputs/aar/lspatch-debug.aar
      - uses: actions/upload-artifact@v4
        with:
          name: WolFox-debug-APK-and-AAR
          path: |
            app/build/outputs/apk/debug/*.apk
            lspatch/build/outputs/aar/*.aar
          if-no-files-found: error
