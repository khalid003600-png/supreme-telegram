name: Build WolFox v3.1.1
on:
  push:
    branches: [wolfox-v311-repair-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Test and build
        env:
          WOLFOX_ALLOW_TEST_KEYSTORE: '1'
        run: |
          chmod +x verify-build-env.sh build-local.sh
          ./verify-build-env.sh
          python3 tests/verify_build_consistency.py
          python3 tests/verify_icon_lifecycle_fix.py
          python3 tests/verify_no_root_dependency.py
          python3 tests/verify_provider_compatibility.py
          ./build-local.sh
      - name: Verify APK
        run: |
          APK="$(find build/local/apk -name '*_SIGNED.apk' -type f -print -quit)"
          test -s "$APK"
          test -s build/local/dex/classes.dex
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" build/local/dex/classes.dex > build/local/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WolFox-v3.1.1-APK-DEX
          path: |
            build/local/apk/*_SIGNED.apk
            build/local/dex/classes.dex
            build/local/SHA256SUMS.txt
          if-no-files-found: error
