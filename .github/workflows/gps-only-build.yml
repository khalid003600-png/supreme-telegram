name: WolFox GPS-only build and verification
on:
  workflow_dispatch:
  push:
    branches:
      - fix/gps-only-build-prerequisites-20261024
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK manager
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --install 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/34.0.0/zipalign"
      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle-8.9-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" --version
      - name: Check project prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties
          test -s app/libs/xposed-api-82.jar
          java -version
          gradle --version
      - name: Run unit tests and lint
        id: quality
        continue-on-error: true
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug
      - name: Assemble unsigned release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK outputs
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK=app/build/outputs/apk/debug/app-debug.apk
          RELEASE_APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$DEBUG_APK"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -v 4 "$RELEASE_APK"
          sha256sum "$DEBUG_APK" "$RELEASE_APK"
          ls -lh "$DEBUG_APK" "$RELEASE_APK"
      - name: Upload APKs and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: WolFox-GPS-only-APK
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/test-results/**
            app/build/reports/**
      - name: Fail if tests or lint failed
        if: steps.quality.outcome == 'failure'
        shell: bash
        run: |
          echo 'Unit tests or lint failed; APK artifacts were uploaded for diagnosis.'
          exit 1
