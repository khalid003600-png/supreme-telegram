name: WolFox GPS-only build and verification
on:
  workflow_dispatch:
  push:
    branches:
      - fix/gps-only-build-prerequisites-20261024
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK tools
        uses: android-actions/setup-android@v3
      - name: Install Gradle 8.9 directly
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform and build tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/34.0.0/zipalign"
      - name: Check project prerequisites
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s app/libs/xposed-api-82.jar
          java -version
          gradle --version
      - name: Run unit tests and lint
        id: quality
        continue-on-error: true
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug
      - name: Assemble unsigned release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK outputs
        run: |
          set -euo pipefail
          DEBUG_APK=app/build/outputs/apk/debug/app-debug.apk
          RELEASE_APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$DEBUG_APK"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -v 4 "$RELEASE_APK"
          sha256sum "$DEBUG_APK" "$RELEASE_APK"
          ls -lh "$DEBUG_APK" "$RELEASE_APK"
      - name: Upload APKs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WolFox-GPS-only-APK
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/test-results/**
            app/build/reports/**
      - name: Fail if tests or lint failed
        if: steps.quality.outcome == 'failure'
        run: |
          echo 'Unit tests or lint failed; APK artifacts were uploaded for diagnosis.'
          exit 1
