# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

# Grant broader permissions so the job can perform repository writes if needed.
permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write
  actions: write
  id-token: write
  security-events: write

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # The setup-gradle action is used to provide a system `gradle` command when the wrapper is not present.
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
      with:
        gradle-version: '8.7'

    - name: Debug repo contents
      run: |
        echo "Working directory: $(pwd)"
        ls -la
        find . -maxdepth 3 -type f -name gradlew -print || true

    - name: Ensure gradlew is executable if present
      run: |
        if [ -f ./gradlew ]; then
          chmod +x ./gradlew
        fi

    - name: Generate Gradle wrapper if missing and commit
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ ! -f ./gradlew ]; then
          echo "Gradle wrapper not found — generating with system Gradle"
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

          # Commit generated wrapper back to repository so future runs have it.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradle/wrapper || true
          if git diff --staged --quiet; then
            echo "No wrapper files to commit"
          else
            git commit -m "CI: add Gradle wrapper" || true
            # Push back to the current branch using the provided GITHUB_TOKEN
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }} || true
          fi
        else
          echo "Gradle wrapper already present"
        fi

    - name: Build with Gradle Wrapper (generated or existing)
      run: |
        if [ -f ./gradlew ]; then
          echo "Using Gradle wrapper"
          ./gradlew build --no-daemon
        else
          echo "Gradle wrapper still not found; using system Gradle"
          gradle build --no-daemon
        fi

    # NOTE: The Gradle Wrapper is the default and recommended way to run Gradle (https://docs.gradle.org/current/userguide/gradle_wrapper.html).

  dependency-submission:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
