name: Build Haram Attendance Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - haram-attendance-android-build
    paths:
      - 'haram-attendance/**'
      - '.github/workflows/haram-attendance-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: haram-attendance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug and unsigned release APKs
        run: gradle --no-daemon --stacktrace assembleDebug assembleRelease
      - name: Validate APK outputs
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -10
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HaramAttendance-APK
          if-no-files-found: warn
          retention-days: 14
          path: haram-attendance/app/build/outputs/apk/**/*.apk
