name: Build all Android branches (Manus)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manus-build-all-branches.yml'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          branches="$(gh api --paginate "repos/$GH_REPOSITORY/branches?per_page=100" --jq '.[].name')"
          test -n "$branches"
          matrix="$(printf '%s\n' "$branches" | python3 -c 'import json,re,sys; print(json.dumps({"include":[{"ref":b,"safe":re.sub(r"[^A-Za-z0-9._-]+","-",b).strip("-") or "branch"} for b in map(str.strip,sys.stdin) if b]},separators=(",",":")))')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  build:
    needs: discover
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf8ee3b0a280d1b47e97a7a496cfcdea504
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          test -s ./gradlew
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@06c43bf37022642920b7520011330b3f61ac58c4
        if: success()
        with:
          name: supreme-telegram-${{ matrix.safe }}-${{ strategy.job-index }}-${{ github.run_number }}
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
          retention-days: 30
