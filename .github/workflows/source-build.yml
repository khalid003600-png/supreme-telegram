name: WolFox source build
on:
  workflow_dispatch:
  push:
    branches: [wolfox-source-build]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components and accept licenses
        run: |
          set -euo pipefail
          echo "--- Environment ---"
          env | sort
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "--- sdkmanager version ---"
          sdkmanager --version || true
          echo "--- Installing SDK components ---"
          # Install cmdline-tools and platform-tools first, then platform and build-tools
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "cmdline-tools;latest" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          # Accept licenses non-interactively
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses
          echo "--- Installed packages ---"
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --list || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK and AAR
        run: gradle --no-daemon :app:assembleDebug :lspatch:assembleRelease --stacktrace
      - name: Check artifacts
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s lspatch/build/outputs/aar/lspatch-release.aar
          APKSIGNER_PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/35.0.0/apksigner"
          echo "Using apksigner at: $APKSIGNER_PATH"
          "$APKSIGNER_PATH" verify app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WolFox-source-build
          path: |
            app/build/outputs/apk/debug/*.apk
            lspatch/build/outputs/aar/*.aar
          if-no-files-found: error
