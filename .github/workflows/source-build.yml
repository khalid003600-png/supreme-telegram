name: WolFox source build
on:
  workflow_dispatch:
  push:
    branches: [wolfox-source-build]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -e
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "cmdline-tools;latest" "platform-tools"
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK and AAR
        run: gradle --no-daemon :app:assembleDebug :lspatch:assembleRelease --stacktrace
      - name: Check artifacts
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s lspatch/build/outputs/aar/lspatch-release.aar
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WolFox-source-build
          path: |
            app/build/outputs/apk/debug/*.apk
            lspatch/build/outputs/aar/*.aar
          if-no-files-found: error
