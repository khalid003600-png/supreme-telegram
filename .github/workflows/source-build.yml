name: WolFox source build
on:
  workflow_dispatch:
  push:
    branches: [wolfox-source-build]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android commandline tools and SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          if [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            TMPDIR="$(mktemp -d)"
            trap 'rm -rf "$TMPDIR"' EXIT
            echo "Downloading Android commandline tools..."
            curl -fsSL -o "$TMPDIR/cmdline-tools.zip" "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q "$TMPDIR/cmdline-tools.zip" -d "$TMPDIR"
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            mv "$TMPDIR"/cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          fi
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not executable at $SDKMANAGER"
            ls -la "$ANDROID_SDK_ROOT/cmdline-tools" || true
            exit 1
          fi
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          "$SDKMANAGER" --version
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null
          set -o pipefail
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK and AAR
        run: gradle --no-daemon :app:assembleDebug :lspatch:assembleRelease --stacktrace
      - name: Check artifacts
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s lspatch/build/outputs/aar/lspatch-release.aar
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WolFox-source-build
          path: |
            app/build/outputs/apk/debug/*.apk
            lspatch/build/outputs/aar/*.aar
          if-no-files-found: error
