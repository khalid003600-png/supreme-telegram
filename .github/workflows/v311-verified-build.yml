name: WolFox v3.1.1 Verified Build
on:
  workflow_dispatch:
  push:
    branches: [wolfox-v311-repair-build]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Verify source
        run: |
          chmod +x verify-build-env.sh build-local.sh
          ./verify-build-env.sh
          python3 tests/verify_build_consistency.py
          python3 tests/verify_icon_lifecycle_fix.py
          python3 tests/verify_no_root_dependency.py
          python3 tests/verify_provider_compatibility.py
      - name: Build
        env:
          WOLFOX_ALLOW_TEST_KEYSTORE: '1'
        run: ./build-local.sh
      - name: Verify output
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find build/local/apk -name '*_SIGNED.apk' -type f -size +0c -print -quit)"
          test -n "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK"
          test -s build/local/dex/classes.dex
          unzip -l "$APK" | grep -q "assets/xposed_init"
          unzip -l "$APK" | grep -q "assets/lspatch_module_info.json"
          unzip -l "$APK" | grep -q "classes.dex"
          sha256sum "$APK" build/local/dex/classes.dex | tee build/local/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WolFox-v3.1.1-verified-build
          path: |
            build/local/apk/*_SIGNED.apk
            build/local/dex/classes.dex
            build/local/SHA256SUMS.txt
          if-no-files-found: error
