name: WolFox source integrity and Android APK
on:
  push:
    branches: [wolfox-current-structure-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0'
      - name: Verify this is the WolFox GPS source
        shell: bash
        run: |
          set -euo pipefail
          grep -F "applicationId 'com.wolfox.gps'" app/build.gradle
          test -s app/src/main/java/com/wolfox/gps/manager/FloatingManager.java
          test -s app/src/main/java/com/wolfox/gps/manager/GPSMockManager.java
          test -s tests-linux/check.sh
      - name: Source regression checks
        run: bash tests-linux/check.sh
      - name: Test and build
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK signature and digest
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk"
          sha256sum "$apk" | tee apk-sha256.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wolfox-gps-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
