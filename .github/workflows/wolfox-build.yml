name: WolFox source build and verification
on:
  workflow_dispatch:
  push:
    branches:
      - wolfox-current-structure-build
      - gps-only-build-fix-20261024
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@b843ebf23cecebc4e3f86bad33dc2e531e896fb5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@d7329e7d5e2ea5f1866b7523dbe0bec99acf856c
      - uses: gradle/actions/setup-gradle@489f7e12493e4dd5b1602ade5f3a942fc7d2a7f3
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Install Android requirements
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          set +o pipefail
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --install "cmdline-tools;latest" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          test -s "$ANDROID_SDK_ROOT/platforms/android-34/android.jar"
      - name: Verify source and static checks
        shell: bash
        run: |
          set -euo pipefail
          grep -F "applicationId 'com.wolfox.gps.edition.gps'" app/build.gradle
          test -s gradle/wrapper/gradle-wrapper.jar
          test -f app/src/main/java/com/wolfox/gps/manager/FloatingManager.java
          test -f app/src/main/java/com/wolfox/gps/manager/GPSMockManager.java
          bash tests-linux/check.sh
      - name: Compile and package APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee wolfox-gradle-build.log
      - name: Run Android unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee wolfox-gradle-tests.log
      - name: Verify signed APK and hashes
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c 4 "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" > apk-sha256.txt
      - name: Upload build logs and test reports even on failure
        uses: actions/upload-artifact@a54395f606b9bdc305651aa0e009abae2055f445
        if: always()
        with:
          name: wolfox-build-diagnostics
          path: |
            wolfox-gradle-build.log
            wolfox-gradle-tests.log
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
      - name: Upload verified APK
        uses: actions/upload-artifact@a54395f606b9bdc305651aa0e009abae2055f445
        if: success()
        with:
          name: wolfox-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            apk-sha256.txt
          if-no-files-found: error
