name: WolFox source build and verification
on:
  workflow_dispatch:
  push:
    branches: [wolfox-current-structure-build]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Install Android requirements
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools'
      - name: Verify source identity and Linux checks
        run: |
          set -euo pipefail
          grep -F "applicationId 'com.wolfox.gps'" app/build.gradle
          test -s gradle/wrapper/gradle-wrapper.jar
          test -f app/src/main/java/com/wolfox/gps/manager/FloatingManager.java
          test -f app/src/main/java/com/wolfox/gps/manager/GPSMockManager.java
          bash tests-linux/check.sh
      - name: Compile, test and package
        run: bash gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Verify signed APK and hashes
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          apksigner verify --verbose "$APK"
          sha256sum "$APK" > apk-sha256.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wolfox-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            apk-sha256.txt
          if-no-files-found: error
