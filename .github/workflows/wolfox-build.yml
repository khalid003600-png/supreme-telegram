name: WolFox GPS-only clean build and verification
on:
  push:
    branches: [gps-only-clean-no-test-data-20261024]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --install 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build and verify unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          bash -n build-local.sh
          for check in \
            verify_build_consistency.py \
            verify_icon_lifecycle_fix.py \
            verify_license_expiry_enforcement.py \
            verify_no_root_dependency.py \
            verify_provider_compatibility.py \
            verify_safe_favorites_map.py \
            verify_merged_runtime.py \
            verify_explicit_visibility.py \
            verify_embedded_hosts.py \
            verify_design_palette.py \
            ; do
            python3 "tests/$check"
          done
          export WOLFOX_UNSIGNED_ONLY=1
          bash build-local.sh
          APK=build/local/apk/WolFox_GPS_Module_v3.1.1_UNSIGNED_ALIGNED.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c 4 "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.wolfox.gps.variant5' versionCode='313' versionName='3.1.1'"
          if "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$APK"; then
            echo 'Expected an unsigned APK, but apksigner verified a signature.' >&2
            exit 1
          fi
          python3 - "$APK" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              assert apk.testzip() is None
              signatures = [n for n in apk.namelist() if n.upper().startswith('META-INF/') and n.upper().endswith(('.RSA', '.DSA', '.EC'))]
              assert not signatures, f'unexpected signature files: {signatures}'
          PY
          sha256sum "$APK" | tee apk-sha256.txt
      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: wolfox-gps-variant5-unsigned-apk
          path: |
            build/local/apk/WolFox_GPS_Module_v3.1.1_UNSIGNED_ALIGNED.apk
            apk-sha256.txt
          if-no-files-found: error
