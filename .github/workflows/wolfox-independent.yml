name: WolFox independent Android build
on:
  workflow_dispatch:
  push:
    branches:
      - wolfox-independent-v2-build
      - wolfox-independent-v3-build
      - wolfox-independent-v5-build
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Explicit unsigned APK build request for variant 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          test -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" || test -x "${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager"
          yes | sdkmanager --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-34' 'build-tools;34.0.0'
      - name: Verify independent variant
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            wolfox-independent-v2-build) EXPECTED=com.wolfox.gps.variant2 ;;
            wolfox-independent-v3-build) EXPECTED=com.wolfox.gps.variant3 ;;
            wolfox-independent-v5-build) EXPECTED=com.wolfox.gps.variant5 ;;
            *) exit 1 ;;
          esac
          grep -F "applicationId '$EXPECTED'" app/build.gradle
          test -s app/libs/xposed-api-82.jar
          if grep -R -E 'K7License|K7Camera|K7Bluetooth|KxG' app/src/main/java; then
            echo "Legacy K7 references remain" >&2
            exit 1
          fi
      - name: Run unit tests and preserve failure report
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee build.log
      - name: Assemble unsigned release APK independently
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee -a build.log
      - name: Verify unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          if "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$APK"; then
            echo "Expected unsigned APK but found signed artifact" >&2
            exit 1
          fi
          sha256sum "$APK" > apk-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wolfox-build-log
          path: |
            build.log
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wolfox-unsigned-release-apk
          path: |
            app/build/outputs/apk/release/*unsigned.apk
            apk-sha256.txt
          if-no-files-found: error
      - name: Enforce unit-test result after uploading APK
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::Unit tests failed. Unsigned APK is available for diagnosis, but build validation is FAILED."
          exit 1
