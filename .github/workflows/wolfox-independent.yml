name: WolFox independent Android build
on:
  workflow_dispatch:
  push:
    branches:
      - wolfox-independent-v2-build
      - wolfox-independent-v3-build
      - wolfox-independent-v5-build
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build.log
      - name: Verify signature
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" > apk-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wolfox-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            apk-sha256.txt
