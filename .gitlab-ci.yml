image: eclipse-temurin:17-jdk
stages:
  - build
variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"
  ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/.android-sdk"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/caches/
    - .gradle/wrapper/
build_android:
  stage: build
  before_script:
    - apt-get update -qq && apt-get install -y -qq wget unzip
    - mkdir -p "$ANDROID_HOME/cmdline-tools"
    - wget -q -O /tmp/commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
    - unzip -q /tmp/commandlinetools.zip -d "$ANDROID_HOME/cmdline-tools"
    - mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
    - export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
    - yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
    - sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
    - wget -q -O /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
    - unzip -q /tmp/gradle.zip -d /opt
  script:
    - /opt/gradle-8.9/bin/gradle --no-daemon :app:assembleDebug --stacktrace
    - test -s app/build/outputs/apk/debug/app-debug.apk
    - "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
    - sha256sum app/build/outputs/apk/debug/app-debug.apk
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - app/build/outputs/apk/debug/*.apk
      - app/build/reports/
