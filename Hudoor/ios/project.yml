name: Hudoor
options:
  bundleIdPrefix: com.khalidalzbaidi
  deploymentTarget:
    iOS: '17.0'
targets:
  Hudoor:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khalidalzbaidi.hudoor
        MARKETING_VERSION: '1.0.0'
        CURRENT_PROJECT_VERSION: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: حضوري
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: نستخدم موقعك عند تسجيل الحضور والانصراف للتحقق من نطاق العمل.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: '5.0'
