// =====================================================
//  WolFox GPS Module — build.gradle (app)
// =====================================================

plugins { id 'com.android.application' }

android {
    namespace 'com.wolfox.gps'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        applicationId 'com.wolfox.gps'
        versionCode 313
        versionName "3.1.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

}

dependencies {
    // Xposed API is compiled from the local stubs/ tree by build-local.sh.
    // No remote Xposed repository is required for the canonical Linux build.
}
